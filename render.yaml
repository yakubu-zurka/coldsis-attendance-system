services:
  # Backend Web Service
  - type: web
    name: coldsis-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production

  # Frontend Static Site
  - type: web
    name: coldsis-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishDir: dist
    envVars:
      - key: NODE_ENV
        value: production
